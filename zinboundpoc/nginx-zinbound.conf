# nginx-zinbound.conf - 用你们自己的服务器托管前端（推荐的多入口方案）
#
# 思路：**完全绕开 BTP/approuter**
#   1) dist/ 里的静态文件由 nginx 直接提供（305 KB，46 个文件）
#   2) /sap/opu/odata/** 反代到 S/4 的 -api 子域，并注入 Basic 认证头
#   3) 浏览器看到的是同源地址 → 无 CORS 问题、无证书警告
#
# 部署步骤：
#   1) cd E:\SAP\代码开发\ui && npm run build          # 产物在 ui\dist
#   2) 把 ui\dist 拷到服务器，例如 /var/www/zinbound
#   3) 把本文件放到 /etc/nginx/conf.d/，改 server_name 与静态目录
#   4) 用 certbot 申请证书（或换成公司现有证书）
#   5) nginx -t && systemctl reload nginx
#
# 注意：
#   * Authorization 头里放通信用户凭据，请给文件 600 权限，勿提交到仓库。
#   * 若要按真实用户审计，改成 OAuth2（S/4 侧通信安排选 OAuth 2.0），
#     由 nginx 先取 token 再转发（复杂度更高，POC 阶段用 Basic 足够）。
#   * S/4 的 client 是 100（my201699）；若要用 client 080 需另建通信用户。

server {
    listen 80;
    server_name zinbound.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zinbound.example.com;

    # ---- 证书（换成你们实际的路径）
    ssl_certificate     /etc/letsencrypt/live/zinbound.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zinbound.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---- 静态资源（UI5 应用，构建产物）
    root /var/www/zinbound;
    index index.html;

    # 上传体积（本应用不需要大文件，保守设小）
    client_max_body_size 4m;

    # ---- OData 反代到 S/4 -api 子域，并注入 Basic 认证
    #      前端 manifest 里是相对路径 /sap/opu/odata/sap/ZSB_INBZB_O2/
    location /sap/opu/odata/ {
        proxy_pass https://my201699-api.s4hana.sapcloud.cn;
        proxy_http_version 1.1;
        proxy_set_header Host              my201699-api.s4hana.sapcloud.cn;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：通信用户凭据（SAPTXYH）
        proxy_set_header Authorization     "Basic <%=BASE64_OF_SAPTXYH_PASSWORD%>";

        # approuter 的等价物：透传 CSRF 相关头
        proxy_pass_request_headers on;
        proxy_set_header X-Requested-With  $http_x_requested_with;
        proxy_set_header X-CSRF-Token      $http_x_csrf_token;
        proxy_set_header Cookie            $http_cookie;

        # 后端是公网证书，正常校验即可
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
    }

    # ---- SPA/静态兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存：UI5 资源可长缓存，index.html 不缓存
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
